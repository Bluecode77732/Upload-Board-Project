# 실제 AWS 배포용 오버레이 — values.yaml의 기본값 위에 이 파일을 얹어 쓴다:
#   helm upgrade sharenpo . -f values-prod.yaml
# 반복되는 `helm upgrade ... --set env.DB_SSL=true --set env.STORAGE_DRIVER=s3 ...`
# 나열을 정리한 것으로, 2026-08-27 첫 실제 배포(`helm get values upload-board -n
# default`)에서 실제로 쓰인 값을 그대로 옮겼다(docs/ROADMAP.md §9, 2026-08-27
# 항목). 비밀값은 여기 없다 — existingSecret 참조만 있을 뿐, values.yaml 상단
# 주석이 설명하는 대로 Secret 리소스는 이 파일이 적용되기 전에 이미
# `kubectl create secret`으로 따로 만들어져 있어야 한다.
#
# 2026-09-07 Terraform 리네이밍(docs/ROADMAP.md §7) 이후로는 이 파일이 더 이상 순수
# 스냅샷이 아니다 — cluster_name에서 결정적으로 유도되는 값(DB_DATABASE/S3_BUCKET/
# existingSecret/role-arn)은 새 이름으로 미리 갱신해 뒀지만, AWS가 생성 시점에
# 랜덤하게 부여하는 DB_HOST만은 다음 실제 apply 전까지 알 수 없어 플레이스홀더로
# 남겨뒀다. 다음 실제 `deploy.sh all` 이후 `terraform output -raw db_host`(app-infra/)로
# 다시 채워 넣을 것.

image:
  tag: 2cd73b9

env:
  AWS_REGION: ap-northeast-2
  BASE_URL: https://sharenpo.cloud
  # 2026-09-07 Terraform 리네이밍(docs/ROADMAP.md §7) 이후, RDS identifier 접두사는
  # "sharenpo-db"가 되지만 뒤의 랜덤 서브도메인(구 값의 "chygueeqyek9")은 AWS가 생성
  # 시점에 새로 부여하는 값이라 apply 전엔 알 수 없다 — 다음 실제 apply 후
  # `terraform output -raw db_host`(app-infra/)로 다시 채워 넣어야 한다. 아래는
  # 더 이상 존재하지 않는 구 인스턴스의 호스트네임이므로 그대로 쓰면 안 된다.
  DB_HOST: REPLACE_AFTER_NEXT_APPLY__terraform_output_db_host
  DB_DATABASE: sharenpo
  # app-infra의 RDS는 rds.force_ssl 파라미터로 TLS를 강제한다 — 이 값이 없으면
  # 마이그레이션 Job이 "no pg_hba.conf entry ... no encryption"로 실패한다.
  DB_SSL: true
