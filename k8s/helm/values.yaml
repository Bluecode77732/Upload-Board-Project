# sharenpo의 기본값 파일.
# ADR 0041(docs/ADR/0041-helm-chart-project-adaptation.md)에 맞춰 프로젝트 전용으로
# 적응시켰다 — 아래 각 기본값이 왜 이 값인지는 그 ADR 참고.

# STORAGE_DRIVER 기본값은 아래에서 "local"인데, 이는 각 pod의 file/temp,
# file/upload 디렉터리가 그 pod만의 임시 디스크라는 뜻이다 — 한 replica로
# 업로드한 파일이 다른 replica에서는 안 보인다(스토리지 계층에 대해 ADR 0029가
# 이미 기록한 것과 같은 다중 인스턴스 문제). env.STORAGE_DRIVER를 "s3"로 바꾼
# 뒤에만 이 값을 올려라.
replicaCount: 1

image:
  repository: bluecode1775/sharenpo
  pullPolicy: IfNotPresent
  # "latest"는 docker-publish CI 잡(.github/workflows/ci.yml)이 계속 새로 붙이는
  # 유동 태그다. 재현 가능한 배포를 원하면 특정 `:<git-sha>` 태그로 고정하라.
  tag: "latest"

imagePullSecrets: []

# 기본은 false — Deployment는 네임스페이스의 default ServiceAccount로 뜨고,
# app-infra/의 IRSA 역할(aws_iam_role.app)도 여전히 default를 수동
# annotate해서 붙여야 한다(k8s/infra/terraform/README.md "Known gap" 참고).
# true로 켜면 이 차트가 전용 ServiceAccount를 만들어 Deployment에 붙이므로
# S3 IRSA 권한이 이 앱 pod에만 좁혀진다 — 단, app-infra/의 IRSA trust policy가
# 지금은 system:serviceaccount:default:default만 신뢰하므로, 실제로 인증까지
# 되게 하려면 그 trust policy를 이 ServiceAccount 이름에 맞게 갱신하는 Terraform
# 쪽 작업이 별도로 필요하다(이 차트 변경만으로는 IRSA가 동작하지 않음).
serviceAccount:
  create: false
  # 비워두면 create=true일 때 sharenpo.fullname(릴리스 이름)을 쓴다.
  name: ""
  annotations: {}
    # eks.amazonaws.com/role-arn: arn:aws:iam::<account>:role/<app-iam-role>

# Dockerfile이 만들고 USER로 전환하는 non-root uid/gid다(ADR 0030).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001

securityContext:
  runAsNonRoot: true
  runAsUser: 1001
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 3000

# 비밀이 아닌 env var — 여기 있는 키 하나하나가 ConfigMap(templates/configmap.yaml)의
# 항목 하나가 되고, envFrom을 통해 컨테이너에 연결된다. 이름과 필수 여부는
# backend/app.module.ts의 Joi 스키마와 반드시 일치해야 한다.
#
# 아래 8개는 Joi가 기본값 없이 required로 요구하는 var만 남긴 것 — 여기서
# 빠지면 ConfigMap에 안 잡히고(빈 문자열도 마찬가지, configmap.yaml이 생략함),
# .env에서 빠졌을 때와 똑같이 pod가 부팅 중 crash-loop에 빠진다.
#
# 나머지 var(BASE_URL, PORT, CORS_ORIGIN, SUPERADMIN_EMAIL, TEMP_SWEEP_*,
# STORAGE_DRIVER, S3_BUCKET, AWS_REGION, CONTENT_SIGNED_URL_TTL_SECONDS)는
# 전부 Joi에 기본값이 있어서 일부러 여기 나열하지 않았다 — 생략하면 앱이
# Joi의 기본값을 그대로 쓰고(.env를 안 채운 것과 동일한 동작), 다른 값이
# 필요하면 배포 시점에 `--set env.<KEY>=<값>`으로 추가하면 된다. 어떤 var가
# 있는지는 backend/app.module.ts의 Joi 스키마나 .env.example이 기준이다.
env:
  ENV: "prod"
  DB_TYPE: "postgres"
  DB_HOST: ""
  DB_PORT: 5432
  DB_DATABASE: ""
  HASH_ROUNDS: 10
  REFRESH_TOKEN_SECRET_EXPIRES_IN: 604800
  ACCESS_TOKEN_SECRET_EXPIRES_IN: 3600

# 비밀 env var(DB_USERNAME, DB_PASSWORD, ACCESS_TOKEN_SECRET,
# REFRESH_TOKEN_SECRET) — 이 차트는 Secret 리소스를 직접 만들지도, 비밀값을
# values.yaml 리터럴로 받지도 않는다(ADR 0041, ADR 0033의 목표 형태).
# `helm install`/`upgrade` 전에 미리 별도로 Secret을 만들어둔다:
#   kubectl create secret generic <name> \
#     --from-literal=DB_USERNAME=... --from-literal=DB_PASSWORD=... \
#     --from-literal=ACCESS_TOKEN_SECRET=... --from-literal=REFRESH_TOKEN_SECRET=...
# 그다음 existingSecret에 그 이름을 지정한다. k8s/helm/README.md 참고.
secrets:
  existingSecret: ""

# 업로드 악성코드 스캔의 clamd 데몬(ADR 0059) — templates/clamav-deployment.yaml +
# clamav-service.yaml이 항상 렌더링한다(DB와 달리 실제 운영에서도 이 클러스터 안에
# 있어야 하는 대상이라 ingress/networkPolicy처럼 기본 꺼두지 않는다). CLAMD_HOST/
# CLAMD_PORT는 여기 없다 — configmap.yaml이 이 Service 이름에서 직접 계산한다.
clamav:
  image:
    repository: clamav/clamav
    tag: stable
  resources: {}
    # 위 app resources와 같은 이유로 기본은 비어 있음(Avoid Premature Optimization).
    # ClamAV는 시그니처 DB 로딩 시 메모리를 상당히 쓰므로, 실측 후 최소
    # limits.memory: 1Gi 정도부터 검토한다.
  persistence:
    # true면 clamav-pvc.yaml이 PVC를 만들어 시그니처 DB를 pod 재시작 사이에도
    # 보존한다. 기본은 emptyDir(재시작마다 재다운로드) — StorageClass를
    # 아직 정하지 않아서다.
    enabled: false
    size: 2Gi
    storageClassName: ""

# 한 번만 도는 migration Job(templates/migration-job.yml)이 Helm의
# pre-install/pre-upgrade hook으로 `migration:run`을 실행한다 —
# docker-compose.yml의 `migrate` 서비스를 본뜬 것(ADR 0032). 이 덕분에
# 스케일된 Deployment가 migration:run과 경합하는 일이 없다.
migration:
  enabled: true

livenessProbe:
  httpGet:
    path: /health/live
    port: http
readinessProbe:
  httpGet:
    path: /health/ready
    port: http

resources: {}
  # 기본 resource requests/limits는 없음(포트폴리오 규모 프로젝트라 아직 실측
  # 기준선이 없음 — CLAUDE.md > Avoid Premature Optimization). 실사용량을
  # 측정한 뒤 명시적으로 설정하라:
  # limits:
  #   cpu: 500m
  #   memory: 512Mi
  # requests:
  #   cpu: 100m
  #   memory: 256Mi

# 프론트엔드(SPA) 워크로드(ADR 0060) — frontend/Dockerfile이 만든 정적 파일 nginx 이미지를 앱
# Deployment와 별도 Pod로 띄우고, 같은 Ingress의 `/` 규칙(아래 ingress.hosts의 `service:
# frontend`)만 이쪽 Service로 보낸다. same-origin이라 CORS_ORIGIN 없이 동작한다. 기본은 비활성 —
# ingress/metrics.serviceMonitor/networkPolicy와 같은 방식이고, 실제 배포는 values-prod.yaml이
# 켠다. 비활성이면 `service: frontend` 경로는 Ingress에서 빠져서(templates/ingress.yaml) 없는
# Service를 가리키는 규칙이 생기지 않는다.
frontend:
  enabled: false
  replicaCount: 1
  image:
    repository: bluecode1775/sharenpo-frontend
    pullPolicy: IfNotPresent
    # 백엔드 image.tag와 같은 이유로 "latest"는 유동 태그다 — deploy.sh가 백엔드와 같은
    # :<git-sha>를 `--set frontend.image.tag=`로 덮어써서 두 이미지가 항상 같은 커밋에서 나온
    # 쌍이 되게 한다.
    tag: "latest"
  service:
    port: 80
  # nginx-unprivileged 이미지의 non-root uid/gid(101) — 앱의 1001과 다르다(ADR 0030과 같은 방침).
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  livenessProbe:
    httpGet:
      path: /
      port: http
  readinessProbe:
    httpGet:
      path: /
      port: http
  resources: {}
    # 앱 resources와 같은 이유로 기본은 비어 있음(Avoid Premature Optimization).

# admin 콘솔 워크로드(ADR 0062) — admin/Dockerfile이 만든 정적 파일 nginx 이미지를 앱·frontend
# Deployment와 별도 Pod로 띄우고, 같은 Ingress의 `/admin` 규칙(아래 ingress.hosts의 `service:
# admin`)만 이쪽 Service로 보낸다. same-origin이라 CORS_ORIGIN 없이 동작한다. 기본은 비활성 —
# frontend와 같은 방식이고, 실제 배포는 values-prod.yaml이 켠다. 비활성이면 `service: admin`
# 경로는 Ingress에서 빠져서(templates/ingress.yaml) 없는 Service를 가리키는 규칙이 생기지 않는다.
admin:
  enabled: false
  replicaCount: 1
  image:
    repository: bluecode1775/sharenpo-admin
    pullPolicy: IfNotPresent
    # 백엔드·frontend image.tag와 같은 이유로 "latest"는 유동 태그다 — deploy.sh가 같은
    # :<git-sha>를 `--set admin.image.tag=`로 덮어써서 세 이미지가 항상 같은 커밋 쌍이 되게 한다.
    tag: "latest"
  service:
    port: 80
  # nginx-unprivileged 이미지의 non-root uid/gid(101) — frontend와 같다(ADR 0030과 같은 방침).
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  livenessProbe:
    httpGet:
      path: /admin/
      port: http
  readinessProbe:
    httpGet:
      path: /admin/
      port: http
  resources: {}
    # 앱 resources와 같은 이유로 기본은 비어 있음(Avoid Premature Optimization).

# TLS는 ingress에서 종료되며, 앱 프로세스 안에서는 절대 하지 않는다(ADR 0034).
# 기본은 비활성 — 실제로 켜려면 살아있는 클러스터, DNS 이름, 인증서 메커니즘
# (ACM 또는 cert-manager)이 필요한데 아직 아무것도 없다.
#
# paths는 단일 "/" catch-all이 아니라 실제 컨트롤러 prefix의 명시적 allow-list다
# (ADR 0058) — ValidationPipe의 whitelist+forbidNonWhitelisted, entities.ts 단일
# 목록과 같은 "선언된 것만 허용" 철학을 Ingress 레벨에 그대로 옮긴 것. /health,
# /metrics, /doc은 의도적으로 뺐다 — health/metrics는 kubelet·Prometheus가
# Ingress를 거치지 않고 파드에 직접 붙으므로 외부 노출이 애초에 불필요하고, doc
# (Swagger)은 인증 게이트가 없는 채로 API 구조 전체를 외부에 지도로 넘겨주는
# 셈이라 노출 이득(포트폴리오 열람)보다 위험이 크다고 판단했다(ADR 0058) — 개발
# 중 로컬 접속이나 클러스터 내부 열람은 그대로 가능하다. 새 컨트롤러를 추가하면
# 이 목록에도 prefix를 함께 추가해야 외부에서 호출 가능해진다 — 안 하면 조용히
# 404.
#
# 예외 하나(ADR 0060): `service: frontend`가 붙은 `/` 규칙은 백엔드가 아니라 프론트엔드 Service로
# 간다. 위의 "catch-all 없음"은 백엔드 Service에 대한 말이다 — 백엔드는 일곱 prefix만 받으므로
# /health, /metrics, /doc은 어떤 규칙 순서에서도 백엔드에 닿지 않고 프론트엔드의 `/`로 떨어진다.
# path의 `service`를 생략하면 백엔드("app")고, frontend.enabled가 false면 이 규칙은 렌더링에서
# 빠진다. `/`가 특정 prefix들보다 아래에 놓인다는 ALB 규칙 순서는 컨트롤러의 문서화된 동작에
# 기대며 라이브 ALB로 확인된 적이 없다(ADR 0060 Consequences).
#
# 주의: Helm은 배열(hosts)을 병합하지 않고 통째로 덮어쓴다 — 나중에
# values-prod.yaml에서 host(실제 도메인)만 바꾸려고 ingress.hosts를 다시 적으면
# paths도 함께 옮겨 적어야 한다. host만 오버라이드하고 paths를 빠뜨리면 "경로
# 없는 Ingress"로 조용히 축소된다(ADR 0058).
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: chart-example.local
      paths:
        - path: /auth
          pathType: Prefix
        - path: /user
          pathType: Prefix
        - path: /post
          pathType: Prefix
        - path: /comment
          pathType: Prefix
        - path: /file
          pathType: Prefix
        - path: /upload
          pathType: Prefix
        - path: /audit-log
          pathType: Prefix
        # 프론트엔드(SPA) — ADR 0060. frontend.enabled가 false면 렌더링에서 빠진다.
        - path: /
          pathType: Prefix
          service: frontend
        # admin 콘솔 — ADR 0062. admin.enabled가 false면 렌더링에서 빠진다. /admin은 위 일곱
        # 백엔드 prefix와도, "/"(frontend)와도 겹치지 않는다.
        - path: /admin
          pathType: Prefix
          service: admin
  tls: []
    # - secretName: chart-example-tls
    #   hosts:
    #     - chart-example.local

# Prometheus 스크레이프 대상(ADR 0047). 기본은 비활성 — ServiceMonitor는
# Prometheus Operator CRD라, kube-prometheus-stack(같은 ADR D2, addons/main.tf의
# enable_kube_prometheus_stack)이 설치된 클러스터에만 존재한다. ingress와 같은
# 이유로 기본 꺼둠(로컬 kind 클러스터 등에서 helm install --wait이 존재하지 않는
# CRD 때문에 실패하지 않도록) — 실제로 켜려면 values-prod.yaml처럼 오버레이한다.
metrics:
  serviceMonitor:
    enabled: false
    interval: 30s
    # kube-prometheus-stack 차트(버전 48.2.3, addons 모듈 기본값)는
    # serviceMonitorSelectorNilUsesHelmValues: true라 자신의 Helm 릴리스 이름과
    # 같은 release 라벨이 붙은 ServiceMonitor만 자동 선택한다 — 그 릴리스 이름은
    # addons/main.tf가 kube_prometheus_stack 변수를 오버라이드하지 않는 한
    # 모듈 기본값인 "kube-prometheus-stack"이다.
    additionalLabels:
      release: kube-prometheus-stack

# Deployment에 추가할 volumes/volumeMounts (예: file/용 PVC — STORAGE_DRIVER=local +
# replicaCount: 1 조합일 때만 의미가 있음, 위 replicaCount 주석 참고).
volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}

# 클러스터 내부 파드 간 트래픽 제한(2026-09-09 보안 점검 발견 항목, ADR 0056). 기본은
# 비활성 — ingress/metrics.serviceMonitor와 같은 이유는 아니고, 지금
# k8s/infra/terraform/cluster/main.tf의 vpc-cni가 Network Policy 강제 에이전트를 켜지
# 않은 상태라 true로 바꿔도 실제 EKS에서는 아직 강제되지 않기 때문이다(별도 Terraform
# 작업 필요, ADR 0056). templates/networkpolicy.yaml 파일 헤더에 인바운드/아웃바운드
# 범위 설계 근거가 있다.
networkPolicy:
  enabled: false
  egress:
    # RDS가 있는 VPC CIDR — cluster/main.tf의 var.vpc_cidr 기본값과 같다. 다른
    # CIDR로 apply했다면 이 값도 맞춰 오버라이드한다.
    vpcCidr: "10.0.0.0/16"
    dbPort: 5432
