# Default values for upload-board-project.
# Project-adapted per ADR 0041 (docs/ADR/0041-helm-chart-project-adaptation.md) —
# see that ADR for why each default below is what it is.

# STORAGE_DRIVER defaults to "local" below, which means each pod's file/temp and
# file/upload directories are that pod's own ephemeral disk — a file uploaded
# through one replica is invisible to the others (the same multi-instance gap
# ADR 0029 already recorded for the storage layer). Raise this only after
# switching env.STORAGE_DRIVER to "s3".
replicaCount: 1

image:
  repository: bluecode1775/sharenpo
  pullPolicy: IfNotPresent
  # "latest" is the docker-publish CI job's floating tag (.github/workflows/ci.yml).
  # Pin to a specific `:<git-sha>` tag instead for a reproducible deploy.
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Non-root uid/gid the Dockerfile creates and USERs into (ADR 0030).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001

securityContext:
  runAsNonRoot: true
  runAsUser: 1001
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 3000

# Non-secret env vars — every key here becomes one entry in the ConfigMap
# (templates/configmap.yaml) and is wired into the container via envFrom.
# Names and requiredness must match the Joi schema in backend/app.module.ts —
# any var missing there that Joi requires makes the pod crash-loop on boot,
# same as a missing var in .env.
env:
  ENV: "prod"
  DB_TYPE: "postgres"
  DB_HOST: ""
  DB_PORT: 5432
  DB_DATABASE: ""
  HASH_ROUNDS: 10
  REFRESH_TOKEN_SECRET_EXPIRES_IN: 604800
  ACCESS_TOKEN_SECRET_EXPIRES_IN: 3600
  BASE_URL: ""
  PORT: 3000
  CORS_ORIGIN: ""
  SUPERADMIN_EMAIL: ""
  TEMP_SWEEP_ENABLED: true
  TEMP_SWEEP_CRON: "0 * * * *"
  TEMP_SWEEP_TTL_HOURS: 24
  TEMP_SWEEP_DRY_RUN: false
  STORAGE_DRIVER: "local"
  S3_BUCKET: ""
  AWS_REGION: ""
  CONTENT_SIGNED_URL_TTL_SECONDS: 300

# Secret env vars (DB_USERNAME, DB_PASSWORD, ACCESS_TOKEN_SECRET,
# REFRESH_TOKEN_SECRET) — this chart never creates a Secret resource or accepts
# a secret value as a values.yaml literal (ADR 0041, ADR 0033's target shape).
# Create the Secret out-of-band before `helm install`/`upgrade`:
#   kubectl create secret generic <name> \
#     --from-literal=DB_USERNAME=... --from-literal=DB_PASSWORD=... \
#     --from-literal=ACCESS_TOKEN_SECRET=... --from-literal=REFRESH_TOKEN_SECRET=...
# then set existingSecret to <name>. See k8s/helm/README.md.
secrets:
  existingSecret: ""

# The one-shot migration Job (templates/migration-job.yml) runs `migration:run`
# as a Helm pre-install/pre-upgrade hook, mirroring docker-compose.yml's
# `migrate` service (ADR 0032) — a scaled Deployment never races migration:run.
migration:
  enabled: true

livenessProbe:
  httpGet:
    path: /health/live
    port: http
readinessProbe:
  httpGet:
    path: /health/ready
    port: http

resources: {}
  # No default resource requests/limits (portfolio-scale project, no measured
  # baseline yet — CLAUDE.md > Avoid Premature Optimization). Set explicitly
  # once real usage is measured:
  # limits:
  #   cpu: 500m
  #   memory: 512Mi
  # requests:
  #   cpu: 100m
  #   memory: 256Mi

# TLS terminates at the ingress, never in-process (ADR 0034). Disabled by
# default — enabling this for real needs a live cluster, a DNS name, and a
# certificate mechanism (ACM or cert-manager), none of which exist yet.
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
    # - secretName: chart-example-tls
    #   hosts:
    #     - chart-example.local

# Additional volumes/volumeMounts on the Deployment (e.g. a PVC for file/, only
# meaningful under STORAGE_DRIVER=local with replicaCount: 1 — see the
# replicaCount comment above).
volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}

# --- Not templated in this pass (ADR 0041) — values kept for a future task,
# no template consumes them yet, so changing them here has no effect today.
serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

# Gateway API alternative to `ingress` above — left disabled; Istio (the
# component that would consume it) has no ADR yet and is planned after
# Terraform (ROADMAP.md).
httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: gateway
      sectionName: http
  hostnames:
    - chart-example.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /headers
