{{- /* ClusterIP 서비스 — 클러스터 내부에서만 접근. 외부 노출은 ingress.yaml(기본 비활성)이 맡는다.
service.annotations는 Ingress 컨트롤러가 Service 단위로 읽는 값(ALB 타깃 그룹 헬스체크 경로 등)을
싣는 자리이고 기본은 비어 있다 — 실제 값은 values-prod.yaml이 정한다. */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sharenpo.fullname" . }}
  labels:
    {{- include "sharenpo.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      # targetPort는 숫자가 아니라 컨테이너 포트 이름("http")으로 참조 — deployment.yml에서
      # containerPort 값이 바뀌어도 이 파일을 따로 고칠 필요가 없다.
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "sharenpo.selectorLabels" . | nindent 4 }}
