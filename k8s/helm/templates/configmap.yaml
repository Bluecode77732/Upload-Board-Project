apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sharenpo.fullname" . }}
  labels:
    {{- include "sharenpo.labels" . | nindent 4 }}
  annotations:
    # hook이 아니면 이 ConfigMap은 일반 리소스라 모든 pre-install hook이 끝난 뒤에야
    # 생성된다 — 그런데 migration-job.yml의 pre-install hook은 이 ConfigMap이
    # 이미 존재해야 한다(envFrom.configMapRef). 그래서 이것도 함께 hook으로
    # 지정하되, 더 이른 weight를 줘서 그 Job과 같은 이른 단계에 두었다.
    # hook-succeeded가 아니라 before-hook-creation을 쓴 이유는, 그래야 일반
    # 단계에서 만들어지는 Deployment/Service가 나중에도 이걸 읽을 수 있어서다.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  {{- range $key, $value := .Values.env }}
  {{- /* 빈 문자열은 "값이 없는 것"과 다르다: Joi.string()은(.allow('') 없이는)
  ""는 거부하지만 선택적 키가 아예 없는 건 허용한다 — .env.example이 이런
  선택적 var를 빈 값으로 두지 않고 주석 처리해두는 것과 같은 계약이다. 그래서
  ""를 그대로 내보내지 않고 생략한다 — 설정 안 된 선택적 var는 앱 입장에서
  "없음"으로 도달해야지, "잘못된 빈 문자열"로 도달하면 안 된다. */}}
  {{- if ne ($value | toString) "" }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
  {{- end }}
