apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "upload-board-project.fullname" . }}
  labels:
    {{- include "upload-board-project.labels" . | nindent 4 }}
  annotations:
    # Without a hook, this ConfigMap is a normal resource created only after
    # ALL pre-install hooks finish — but migration-job.yml's pre-install hook
    # needs it to already exist (envFrom.configMapRef). Hooking it in too, at
    # an earlier weight, puts it in the same early phase as that Job.
    # before-hook-creation (not hook-succeeded) keeps it alive afterward, so
    # the Deployment/Service created in the normal phase can still read it.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  {{- range $key, $value := .Values.env }}
  {{- /* An empty string is not the same as unset: Joi.string() (no
  .allow('')) rejects "" but accepts an absent var for optional keys —
  the same contract .env.example expresses by commenting these out rather
  than setting them blank. Omit rather than emit "" so an unconfigured
  optional var reaches the app as absent, not as an invalid empty string. */}}
  {{- if ne ($value | toString) "" }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
  {{- end }}
