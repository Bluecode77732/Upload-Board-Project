{{- /*
serviceAccount.create가 false(기본값)면 이 파일은 아무것도 렌더링하지 않고,
Deployment는 네임스페이스의 default ServiceAccount를 계속 쓴다(ingress.yaml과
같은 조건부 렌더링 패턴). true로 켜면 이 앱 전용 ServiceAccount를 만들어
S3 IRSA 권한 범위를 default에서 이 앱으로 좁힌다 — values.yaml의 serviceAccount
블록 주석과 k8s/infra/terraform/README.md "Known gap" 참고.
*/}}
{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sharenpo.serviceAccountName" . }}
  labels:
    {{- include "sharenpo.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
