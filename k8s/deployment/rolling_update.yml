apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  labels: 
    app: nginx-app
    type: back-end

spec: 
  replicas: 5
  template: 
    metadata:
      labels: 
        app: nginx-app
        type: back-end
    spec:
      containers:   
        - name: nginx-containers
          image: nginx:1.20
          ports:
            - containerPort: 80
  selector:
    matchLabels:
      app: nginx-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
