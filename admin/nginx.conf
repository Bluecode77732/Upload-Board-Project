# 목적: admin SPA 정적 파일 서버 설정(ADR 0062) — admin/Dockerfile이 nginx의 conf.d/default.conf로
#   복사한다. 백엔드·frontend/와 같은 ALB에서 `/admin` 규칙이 이 서버로 트래픽을 보낸다.
# 이유: ALB는 경로를 재작성하지 않으므로 `/admin/...`이 그대로 들어온다 — frontend/nginx.conf와
#   달리 모든 location이 `/admin/`에 고정되고 `root`가 아니라 `alias`로 그 prefix를 벗겨낸다.
#   SPA는 딥링크(/admin/dashboard 등)를 새로고침해도 열려야 하고, helmet(ADR 0055)은 API
#   응답에만 걸려서 SPA 문서에는 보안 헤더를 여기서 따로 붙여야 한다.

server {
    listen 8080;
    server_name _;

    index index.html;

    # 내부 포트(8080)가 리다이렉트의 Location 헤더로 새어 나가지 않게 한다.
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 보안 헤더. add_header는 여기(server)에만 둔다 — location 안에 add_header가 하나라도
    # 있으면 nginx가 상위(server)의 add_header를 통째로 무시하기 때문에, 캐시 정책은 헤더가
    # 아니라 아래 location의 expires 지시어로 준다.
    #
    # CSP: script/style은 자기 origin만(Vite 빌드는 외부 파일만 내보낸다). admin은 파일 미리보기
    # 없이 조회/변경 API만 부르므로 frontend/nginx.conf의 이미지·미디어·S3 허용은 필요 없다.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # TLS는 ALB에서 끝나므로(ADR 0034) 이 서버는 평문 HTTP지만, 브라우저는 ALB를 거친 HTTPS
    # 응답에서 이 헤더를 받는다. 값은 helmet 기본값(ADR 0055)과 같다.
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

    # 끝에 슬래시 없는 "/admin"도 ALB의 Prefix 규칙이 전달할 수 있는 요청이다(buildPathPatterns가
    # /admin과 /admin/* 둘 다 만든다) — 아래 location들은 슬래시 있는 URI만 매칭하므로 별도로 받는다.
    location = /admin {
        return 301 /admin/;
    }

    # Vite가 해시 파일명으로 내보내는 정적 자산 — 내용이 바뀌면 이름이 바뀌므로 오래 캐시한다.
    # 없는 파일은 SPA fallback으로 삼키지 않고 404로 돌려준다.
    location /admin/assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;
        try_files $uri =404;
    }

    # /admin/ 아래 그 밖의 모든 경로는 SPA가 처리한다 — index.html로 fallback해서 딥링크가
    # 새로고침에도 열린다. index.html은 새 배포 직후 바로 바뀌어야 하므로 캐시하지 않는다.
    location /admin/ {
        alias /usr/share/nginx/html/;
        expires -1;
        try_files $uri /admin/index.html;
    }

    # 이 파드에는 /admin 밖으로 넘길 다른 워크로드가 없다 — ALB가 다른 곳으로 보낼 요청이
    # 여기 도달하는 일은 없어야 하지만, 혹시 도달하면 SPA로 흘려보내지 않고 바로 404다.
    location / {
        return 404;
    }
}
