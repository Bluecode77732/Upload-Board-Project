# 목적: SPA 정적 파일 서버 설정(ADR 0060) — frontend/Dockerfile이 nginx의 conf.d/default.conf로
#   복사한다. 백엔드와 같은 호스트에서 ALB의 `/` 규칙이 이 서버로 트래픽을 보낸다.
# 이유: SPA는 딥링크(/posts/:id 등)를 새로고침해도 열려야 하고, helmet(ADR 0055)은 API
#   응답에만 걸려서 SPA 문서에는 보안 헤더를 여기서 따로 붙여야 한다.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 내부 포트(8080)가 리다이렉트의 Location 헤더로 새어 나가지 않게 한다.
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 보안 헤더. add_header는 여기(server)에만 둔다 — location 안에 add_header가 하나라도
    # 있으면 nginx가 상위(server)의 add_header를 통째로 무시하기 때문에, 캐시 정책은 헤더가
    # 아니라 아래 location의 expires 지시어로 준다.
    #
    # CSP: script/style은 자기 origin만(Vite 빌드는 외부 파일만 내보낸다). 이미지·미디어·fetch는
    # STORAGE_DRIVER=s3에서 GET /file/:id/content가 S3 presigned URL로 302하므로(ADR 0036)
    # https://*.amazonaws.com을 허용하고, blob:은 비공개 파일 미리보기에 쓰는 URL.createObjectURL용이다.
    # S3 경로는 브라우저로 확인하기 전의 추정값이다(ADR 0060 Consequences).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https://*.amazonaws.com; media-src 'self' blob: https://*.amazonaws.com; connect-src 'self' https://*.amazonaws.com; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # TLS는 ALB에서 끝나므로(ADR 0034) 이 서버는 평문 HTTP지만, 브라우저는 ALB를 거친 HTTPS
    # 응답에서 이 헤더를 받는다. 값은 helmet 기본값(ADR 0055)과 같다.
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

    # Vite가 해시 파일명으로 내보내는 정적 자산 — 내용이 바뀌면 이름이 바뀌므로 오래 캐시한다.
    # 없는 파일은 SPA fallback으로 삼키지 않고 404로 돌려준다. 깨진 자산 요청이 index.html 200으로
    # 위장되면 원인을 찾기 어렵다.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # 그 밖의 모든 경로는 SPA가 처리한다 — index.html로 fallback해서 딥링크가 새로고침에도 열린다.
    # index.html은 새 배포 직후 바로 바뀌어야 하므로 캐시하지 않는다.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
