# CI (ADR 0016): backend lint + unit + e2e, plus frontend/admin lint and admin
# unit tests. frontend/ and admin/ are independent projects with their own
# pnpm-lock.yaml (not a pnpm workspace), so each gets its own job with
# `working-directory` and its own install.
# Toolchain comes from the ADR 0014 pin (.nvmrc + packageManager via Corepack);
# the e2e DB image matches ADR 0015 (postgres:16).

name: Sharenpo CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Corepack activates the pnpm version pinned in package.json (packageManager);
      # it must run before setup-node's cache step, which shells out to pnpm to
      # resolve the store path.
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint:ci
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # No .env in CI — the suite reads these from the environment (e2e-utils
      # overrides DB_DATABASE to its throwaway DB at runtime).
      ENV: dev
      DB_TYPE: postgres
      # 127.0.0.1, not localhost: the service port is mapped on IPv4 only, and
      # `localhost` can resolve to ::1 first and fail to connect.
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: postgres
      HASH_ROUNDS: 10
      ACCESS_TOKEN_SECRET: ci-access-secret
      REFRESH_TOKEN_SECRET: ci-refresh-secret
      ACCESS_TOKEN_SECRET_EXPIRES_IN: 180
      REFRESH_TOKEN_SECRET_EXPIRES_IN: 43200
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Upload folders are runtime dirs (untracked); the promotion test needs both.
      - run: mkdir -p file/temp file/upload
      - run: pnpm run test:e2e

  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint

  admin-lint-and-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: admin/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run test
