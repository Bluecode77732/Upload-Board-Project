# 목적: docker-publish(ADR 0048)가 이제 드문 main 머지가 아니라 모든 dev
# push마다 도는 만큼, Docker Hub의 bluecode1775/sharenpo,
# bluecode1775/sharenpo-frontend(ADR 0060, docker-publish-frontend),
# bluecode1775/sharenpo-admin(ADR 0062, docker-publish-admin) 세
# 저장소 모두에 commit-sha 태그가 무한정 쌓이는 걸 막는다.
# 사용법: cron으로 매일 돌고, workflow_dispatch로 필요할 때도 실행 가능
# (기본값은 dry run — `dry_run` 입력 참고).
# 브랜치 관련 주의: `on.schedule`엔 `branches:` 필터가 없다 — GitHub Actions는
# 이 파일에 뭐라고 적혀 있든 항상 저장소의 기본 브랜치(`main`)에 있는 파일
# 사본에서만 예약 트리거를 실행하고, `dev`에서는 절대 실행하지 않는다. 이
# 파일이 `main`에 반영되기(향후 dev->main 머지) 전까지는 아래 cron 항목이
# 죽어 있는 상태이며, 그 전에 이 워크플로우를 돌릴 유일한 방법은
# `workflow_dispatch`를 `--ref dev`로 명시하는 것(또는 Actions UI의 "Use
# workflow from" 브랜치 선택기)이다.
# 정리 로직 자체는 어느 쪽이든 브랜치에 종속되지 않는다 — 어떤 sha가 어느
# 브랜치에서 나왔는지 신경 쓰지 않고 Docker Hub의 전체 태그 목록을 훑으므로,
# 어느 브랜치의 사본에서 돌리든 양쪽 sha 태그를 모두 정리한다.
# 근거: Docker Hub 무료 티어에는 태그 보존 정책이 내장되어 있지 않다.
# 제외 목록이 아니라 구조적으로 안전하게 만들었다: 이 로직은 40자리 hex
# git SHA 형태(정확히 `${{ github.sha }}`가 만드는 모양)와 일치하는 태그만
# 고려한다 — :latest나 수동으로 만든 태그(예: values-prod.yaml에 고정된
# image.tag)는 이 패턴과 절대 일치할 수 없으므로, KEEP을 뭐로 설정하든
# 삭제 대상으로 선택될 수 없다.

name: Docker Hub Tag Cleanup

on:
  schedule:
    - cron: '0 3 * * *' # 매일 03:00 UTC — 실제로 어느 브랜치 사본이 도는지는 위 브랜치 관련 주의 참고
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List tags that would be deleted without deleting them'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    # 저장소 세 개(백엔드, ADR 0060의 프론트엔드, ADR 0062의 admin)에 같은 정리 로직을 각각
    # 돌린다 — REPO 하나만 바뀌므로 스크립트 자체는 그대로 재사용한다. fail-fast: false는
    # 한 저장소 정리가 실패해도(예: 아직 어느 브랜치에서도 첫 이미지가 발행되지
    # 않아 저장소가 생기기 전) 다른 저장소까지 취소되지 않게 한다 — 다만 존재하지 않는
    # 저장소는 실패하지 않고 "태그 0개"로 정상 종료된다(태그 목록 API가 404를
    # 반환해도 이 스크립트의 페이지네이션 루프가 빈 결과로 처리한다).
    strategy:
      fail-fast: false
      matrix:
        repo: [sharenpo, sharenpo-frontend, sharenpo-admin]
    env:
      NAMESPACE: bluecode1775
      REPO: ${{ matrix.repo }}
      KEEP: 30
      # schedule로 트리거된 실행에는 workflow_dispatch 입력 자체가 없으므로,
      # cron 발동은 항상 "false"(실제 삭제)로 결정된다; 수동 실행은 실행하는
      # 사람이 명시적으로 끄지 않는 한 기본값 "true"(미리보기만)로 간다.
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
    steps:
      - name: Delete old commit-sha tags beyond the newest KEEP
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          set -euo pipefail

          TOKEN=$(curl -s -H "Content-Type: application/json" -X POST \
            -d "{\"username\": \"${DOCKER_USERNAME}\", \"password\": \"${DOCKER_PASSWORD}\"}" \
            https://hub.docker.com/v2/users/login/ | jq -r '.token')

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Docker Hub authentication failed" >&2
            exit 1
          fi

          SHA_REGEX='^[0-9a-f]{40}$'
          ALL_SHA_TAGS=()
          URL="https://hub.docker.com/v2/repositories/${NAMESPACE}/${REPO}/tags/?page_size=100&ordering=-last_updated"

          while [ -n "$URL" ] && [ "$URL" != "null" ]; do
            RESPONSE=$(curl -s -H "Authorization: JWT ${TOKEN}" "$URL")
            while IFS= read -r tag; do
              if [[ "$tag" =~ $SHA_REGEX ]]; then
                ALL_SHA_TAGS+=("$tag")
              fi
            done < <(echo "$RESPONSE" | jq -r '.results[].name')
            URL=$(echo "$RESPONSE" | jq -r '.next')
          done

          echo "Found ${#ALL_SHA_TAGS[@]} sha-shaped tags (newest first)."

          if [ "${#ALL_SHA_TAGS[@]}" -le "$KEEP" ]; then
            echo "At or under the retention count ($KEEP) — nothing to delete."
            exit 0
          fi

          TO_DELETE=("${ALL_SHA_TAGS[@]:$KEEP}")
          echo "${#TO_DELETE[@]} tag(s) older than the newest ${KEEP} are eligible for deletion."

          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run — would delete:"
            printf '  %s\n' "${TO_DELETE[@]}"
            exit 0
          fi

          for tag in "${TO_DELETE[@]}"; do
            echo "Deleting ${tag}"
            curl -s -o /dev/null -w "  -> HTTP %{http_code}\n" -X DELETE \
              -H "Authorization: JWT ${TOKEN}" \
              "https://hub.docker.com/v2/repositories/${NAMESPACE}/${REPO}/tags/${tag}/"
          done
